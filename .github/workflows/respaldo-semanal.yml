# Respaldo automático de la base de datos cada domingo a las 3:00 a. m. (hora de Colombia).
# Guarda el archivo como artefacto privado del repositorio durante 90 días.
# Requiere el secreto DIRECT_URL en Settings → Secrets and variables → Actions.
name: Respaldo semanal de la base de datos
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente de PostgreSQL 16
        run: |
          sudo apt-get install -y wget ca-certificates
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc
          sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Crear respaldo
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node servidor/herramientas/respaldo.js
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-zenite-${{ github.run_number }}
          path: respaldos/*.dump
          retention-days: 90
