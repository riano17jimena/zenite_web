# Configuración de despliegue en Netlify (plan gratuito).
# Sitio estático: no hay paso de compilación; se publica la carpeta raíz.

[build]
  publish = "."
  command = "npm test"

# La API y el panel viven en Render (zenite-api.onrender.com) y las fotos y
# videos subidos desde el panel, en Supabase Storage. Si cambia alguna de esas
# direcciones, actualícela también en la política de seguridad de contenido.

# Encabezados de seguridad para todas las páginas (RNF Seguridad).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co https://zenite-api.onrender.com; media-src 'self' https://*.supabase.co https://zenite-api.onrender.com; connect-src 'self' https://zenite-api.onrender.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Caché larga para recursos estáticos que cambian poco (RNF Rendimiento).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las tarifas y el portafolio se revalidan siempre para reflejar cambios de inmediato.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los archivos de pruebas y documentación no se publican.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/herramientas/*"
  to = "/404.html"
  status = 404
  force = true

# El código del servidor y la configuración de despliegue no se publican en el sitio.
[[redirects]]
  from = "/servidor/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/render.yaml"
  to = "/404.html"
  status = 404
  force = true

# Páginas de servicios anteriores → nuevos tipos de proyecto
[[redirects]]
  from = "/servicios/propiedad-horizontal.html"
  to = "/servicios/residencial.html"
  status = 301

[[redirects]]
  from = "/servicios/casa.html"
  to = "/servicios/residencial.html"
  status = 301

[[redirects]]
  from = "/servicios/lote.html"
  to = "/servicios/urbanismo.html"
  status = 301

[[redirects]]
  from = "/servicios/remodelacion.html"
  to = "/servicios/intervenciones.html"
  status = 301

[[redirects]]
  from = "/servicios/hospitalario.html"
  to = "/servicios/dotacional.html"
  status = 301
